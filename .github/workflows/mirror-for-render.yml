# Copia main de Eugecom/aris-bags → euge-dotnet/aris-bags para que Render despliegue
# sin cambiar de cuenta en Render. Ver docs/DEPLOY-RENDER-ESPEJO.md

name: Mirror for Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror
        env:
          MIRROR_TOKEN: ${{ secrets.RENDER_MIRROR_TOKEN }}
          MIRROR_REPO: ${{ vars.RENDER_MIRROR_REPO }}
        run: |
          if [ -z "$MIRROR_TOKEN" ] || [ -z "$MIRROR_REPO" ]; then
            echo "Falta RENDER_MIRROR_TOKEN (secret) o RENDER_MIRROR_REPO (variable), ej. euge-dotnet/aris-bags"
            exit 1
          fi
          # checkout@v4 deja credenciales de GITHUB_TOKEN; hay que quitarlas para usar el PAT.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git" HEAD:main --force
