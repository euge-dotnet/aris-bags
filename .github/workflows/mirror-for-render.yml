# Copia main de Eugecom/aris-bags → repo de Render (ej. euge-dotnet/aris-bags).
# Usa deploy key con escritura. Ver docs/DEPLOY-RENDER-ESPEJO.md

name: Mirror for Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH deploy key
        env:
          DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
          MIRROR_REPO: ${{ vars.RENDER_MIRROR_REPO }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$MIRROR_REPO" ]; then
            echo "Faltan MIRROR_DEPLOY_KEY (secret) o RENDER_MIRROR_REPO (variable)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Push mirror
        env:
          MIRROR_REPO: ${{ vars.RENDER_MIRROR_REPO }}
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push "git@github.com:${MIRROR_REPO}.git" HEAD:main --force
