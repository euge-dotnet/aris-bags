# Opcional: PostgreSQL local si tenés Docker.
# No es obligatorio. También se puede usar PostgreSQL instalado o Neon.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aris-bags-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aris_bags
    ports:
      - "5432:5432"
    volumes:
      - aris_bags_pg:/var/lib/postgresql/data

volumes:
  aris_bags_pg:
